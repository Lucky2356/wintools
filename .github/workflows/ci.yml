name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate catalogue and protected list
        shell: powershell
        run: .\lib\helpers.ps1 -Action ValidateData -Root $PWD
      - name: Parse PowerShell helper
        shell: powershell
        run: $null = [scriptblock]::Create((Get-Content .\lib\helpers.ps1 -Raw))
      - name: Runtime regression checks (no system changes)
        shell: powershell
        run: .\tests\runtime.ps1
      - name: Critical failure paths (stubbed system commands)
        shell: powershell
        run: .\tests\failures.ps1
      - name: Real Windows integration (disposable runner only)
        shell: powershell
        run: .\tests\integration.ps1
