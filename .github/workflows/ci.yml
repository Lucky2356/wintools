name: validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish v<VERSION> from main after all checks pass'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  catalogue:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate catalogue and protected list
        shell: powershell
        run: .\lib\helpers.ps1 -Action ValidateData -Root $PWD
      - name: Parse PowerShell helper
        shell: powershell
        run: $null = [scriptblock]::Create((Get-Content .\lib\helpers.ps1 -Raw))
      - name: Runtime regression checks (no system changes)
        shell: powershell
        run: .\tests\runtime.ps1
      - name: Critical failure paths (stubbed system commands)
        shell: powershell
        run: .\tests\failures.ps1
      - name: Real Windows integration (disposable runner only)
        shell: powershell
        run: .\tests\integration.ps1
      - name: Diagnostics and cleanup boundaries
        shell: powershell
        run: .\tests\maintenance.ps1
      - name: Store package integration (disposable signed fixture)
        shell: powershell
        run: .\tests\store.ps1

  package:
    needs: catalogue
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Package tested source and verify archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(-rc\.\d+)?$') { throw 'Invalid version' }
          New-Item -ItemType Directory dist | Out-Null
          $zip = "dist/wintools-$version.zip"
          git archive --format=zip --output=$zip HEAD wintweaks.cmd menu.cmd lib data README.md CHANGELOG.md SECURITY.md VERSION docs
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $zip))
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @('wintweaks.cmd','menu.cmd','lib/helpers.ps1','data/tweaks.def','data/descr.en','VERSION')) {
              if ($required -notin $entries) { throw "Missing $required" }
            }
            if ($entries -match '^(state|backups|logs|reports|tests|\.git)/|promt\.md$') { throw 'Unexpected release contents' }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD ($zip + '.sha256')), "$hash  wintools-$version.zip`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  portable:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: dist
      - name: Build single portable executable
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          .\ui\build.ps1 -EngineZip "$PWD\dist\wintools-$version.zip"
      - name: Test portable UI, worker and updater
        shell: powershell
        run: .\tests\portable.ps1 -Executable "$PWD\dist\portable\WintoolsPortable.exe"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: portable-ui-${{ matrix.os }}
          path: dist/portable/portable-ui*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-2022'
        with:
          name: portable-executable
          path: |
            dist/portable/WintoolsPortable.exe
            dist/portable/WintoolsPortable.exe.sha256
          if-no-files-found: error

  release:
    # Publishes only commits whose full validation and portable tests passed in this run:
    # a pushed v* tag, or a manual run on main with release=true that creates the tag itself.
    needs: [package, portable]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: portable-executable
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$EVENT" = workflow_dispatch ]; then
            TAG="v$version"
            # A manual run never moves or reuses an existing tag.
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then echo "Tag $TAG already exists"; exit 1; fi
            tag_args=(--target "$GITHUB_SHA")
          else
            TAG="$REF_NAME"
            tag_args=(--verify-tag)
          fi
          if [ "$TAG" != "v$version" ]; then echo "Tag $TAG does not match VERSION $version"; exit 1; fi
          awk -v heading="## $version" '{sub(/\r$/,"")} $0==heading{found=1;next} /^## /{if(found)exit} found' CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then echo "CHANGELOG has no section for $version"; exit 1; fi
          printf '\nДля запуска скачайте WintoolsPortable.exe. Контрольные суммы SHA-256 приложены.\n' >> dist/notes.md
          cd dist
          files=(WintoolsPortable.exe WintoolsPortable.exe.sha256 "wintools-$version.zip" "wintools-$version.zip.sha256")
          for file in "${files[@]}"; do if [ ! -s "$file" ]; then echo "Missing $file"; exit 1; fi; done
          sha256sum -c WintoolsPortable.exe.sha256 "wintools-$version.zip.sha256"
          case "$version" in *-*) channel=--prerelease ;; *) channel=--latest ;; esac
          gh release create "$TAG" "${tag_args[@]}" --title "Wintools $version" --notes-file notes.md "$channel" "${files[@]}"
