name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate catalogue and protected list
        shell: powershell
        run: .\lib\helpers.ps1 -Action ValidateData -Root $PWD
      - name: Parse PowerShell helper
        shell: powershell
        run: $null = [scriptblock]::Create((Get-Content .\lib\helpers.ps1 -Raw))
      - name: Runtime regression checks (no system changes)
        shell: powershell
        run: .\tests\runtime.ps1
      - name: Critical failure paths (stubbed system commands)
        shell: powershell
        run: .\tests\failures.ps1
      - name: Real Windows integration (disposable runner only)
        shell: powershell
        run: .\tests\integration.ps1
      - name: Diagnostics and cleanup boundaries
        shell: powershell
        run: .\tests\maintenance.ps1

  package:
    needs: catalogue
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Package tested source and verify archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(-rc\.\d+)?$') { throw 'Invalid version' }
          New-Item -ItemType Directory dist | Out-Null
          $zip = "dist/wintools-$version.zip"
          git archive --format=zip --output=$zip HEAD wintweaks.cmd menu.cmd lib data README.md CHANGELOG.md SECURITY.md VERSION
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $zip))
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @('wintweaks.cmd','menu.cmd','lib/helpers.ps1','data/tweaks.def','VERSION')) {
              if ($required -notin $entries) { throw "Missing $required" }
            }
            if ($entries -match '^(state|backups|logs|reports|tests|\.git)/|promt\.md$') { throw 'Unexpected release contents' }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD ($zip + '.sha256')), "$hash  wintools-$version.zip`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  portable:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: dist
      - name: Build single portable executable
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          .\ui\build.ps1 -EngineZip "$PWD\dist\wintools-$version.zip"
      - name: Test portable UI, worker and updater
        shell: powershell
        run: .\tests\portable.ps1 -Executable "$PWD\dist\portable\WintoolsPortable.exe"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: portable-ui-${{ matrix.os }}
          path: dist/portable/portable-ui.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-2022'
        with:
          name: portable-executable
          path: |
            dist/portable/WintoolsPortable.exe
            dist/portable/WintoolsPortable.exe.sha256
          if-no-files-found: error
